            z-index: 0;

        body::after {
            bottom: -180px;
            left: -180px;
            background: radial-gradient(circle at center,
            #c4b5fd 0%,
            #e0f2fe 40%,
            transparent 70%);
        }
        .logo {
            position: fixed;
            bottom: 2rem;
            left: 50%;

        .logo svg {
            height: 40px;
            width: auto;

            padding: 2rem;

            text-align: center;
            position: relative;
            z-index: 2;
        }

            width: 88px;
            height: 88px;

            align-items: center;
            justify-content: center;

            width: 40px;
            height: 40px;
            color: var(--color-primary);
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--color-text-dark);
            letter-spacing: -0.02em;
        }

            font-size: 1.0625rem;
            color: var(--color-text-body);

            margin: 0 auto;

            font-size: 0.9375rem;
            color: var(--color-text-muted);
        }
        .contact a {
            color: var(--color-primary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .contact a:hover {
            color: var(--color-primary-dark);
        }

            }
        }
